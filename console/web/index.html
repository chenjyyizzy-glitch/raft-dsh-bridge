<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raft DSH 控制台</title>
<style>
:root { color-scheme: dark; --bg:#020617; --bg-soft:#0b1220; --card:#0f172a; --card-2:#111c33; --line:#1e293b; --line-soft:#243247; --fg:#e2e8f0; --muted:#94a3b8; --ok:#34d399; --bad:#fb7185; --accent:#2dd4bf; --accent-strong:#14b8a6; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter','Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; color:var(--fg); min-height:100vh; background: radial-gradient(1100px 520px at 85% -10%, rgba(45,212,191,.10), transparent 60%), radial-gradient(900px 480px at -5% 5%, rgba(20,184,166,.08), transparent 55%), var(--bg); }
header { position:sticky; top:0; z-index:10; padding:14px 22px; background:rgba(2,6,23,.82); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
h1 { font-size:17px; margin:0; letter-spacing:.2px; }
h1::before { content:''; display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:9px; background:linear-gradient(135deg,#2dd4bf,#0d9488); box-shadow:0 0 14px rgba(45,212,191,.55); }
.meta { color:var(--muted); font-size:12px; }
main { max-width:1560px; margin:14px auto; padding:0 16px 44px; }
.card { position:relative; background:linear-gradient(180deg, rgba(30,41,59,.42), rgba(15,23,42,.88)); border:1px solid var(--line); border-radius:13px; padding:12px 14px; margin-bottom:14px; box-shadow:0 14px 34px rgba(0,0,0,.28); backdrop-filter:blur(8px); transition:border-color .15s ease, transform .15s ease; }
.card:hover { border-color:rgba(45,212,191,.28); }
#services { display:grid; grid-template-columns:repeat(2, minmax(320px, 1fr)); gap:10px; }
.service-row { background:rgba(15,23,42,.55); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:0; }
#agents { display:grid; grid-template-columns:repeat(auto-fill, minmax(470px, 1fr)); gap:13px; margin-top:10px; }
.agent-card { border-left:3px solid var(--line-soft); margin-bottom:0; }
.agent-card.connected { border-left-color:var(--accent-strong); }
.agent-card.active { border-left-color:var(--accent); }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.agent-name { font-weight:700; font-size:16px; color:#f1f5f9; }
.badge { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; line-height:1.5; border:1px solid var(--line); background:rgba(2,6,23,.55); color:#cbd5e1; }
.badge.ok { color:var(--ok); border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.08); }
.badge.bad { color:var(--bad); border-color:rgba(251,113,133,.35); background:rgba(251,113,133,.07); }
.badge.live { color:var(--accent); border-color:rgba(45,212,191,.4); background:rgba(45,212,191,.08); }
.badge.phase { color:var(--fg); }
.muted { color:var(--muted); }
.agent-meta { margin:9px 0 11px; font-size:13px; color:var(--muted); }
.agent-meta b { color:#e6f7f4; font-weight:600; }
.thinking { background:rgba(2,6,23,.62); border:1px solid var(--line); border-radius:9px; padding:7px 10px; font-size:12px; color:#d7e3f4; min-height:2.7em; }
.thinking .phase-line { display:flex; align-items:center; gap:8px; color:var(--muted); margin-bottom:3px; }
.thinking .think-scroll { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; line-height:1.45; max-height:2.9em; white-space:pre-wrap; word-break:break-word; color:var(--fg); }
.thinking .think-scroll:empty::before { content:'（暂无思考内容）'; color:var(--muted); }
.pulse { width:8px; height:8px; border-radius:50%; background:#334155; flex:0 0 auto; }
.pulse.on { background:var(--accent); box-shadow:0 0 10px rgba(45,212,191,.8); animation:blink 1s infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }
.stats { margin-top:8px; padding-top:7px; border-top:1px dashed var(--line); font-size:12px; color:var(--muted); }
.stats b { color:#d9fbf4; font-weight:600; }
.actions { margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
button { font:inherit; border:1px solid transparent; color:#032b27; background:linear-gradient(135deg,#2dd4bf,#0d9488); border-radius:8px; padding:6px 13px; cursor:pointer; font-weight:600; transition:filter .12s ease, opacity .12s ease, border-color .12s ease; }
button:hover:not(:disabled) { filter:brightness(1.1); }
button.ghost { background:transparent; color:#94a3b8; border-color:var(--line); }
button.ghost:hover:not(:disabled) { color:#e2e8f0; border-color:rgba(45,212,191,.4); }
button.danger { background:transparent; color:var(--bad); border-color:rgba(251,113,133,.38); }
button.danger:hover:not(:disabled) { background:rgba(251,113,133,.08); }
button:disabled { opacity:.4; cursor:not-allowed; }
.action-note { font-size:12px; color:var(--muted); }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:#1e293b; border-radius:999px; }
::-webkit-scrollbar-thumb:hover { background:#334155; }
</style>
</head>
<body>
<header>
  <div><h1>Raft DSH 控制台</h1><div class="meta">本地管理台 · 仅监听 127.0.0.1 · 只显示 builtin runtime agent</div></div>
  <div class="row" id="topStatus"><span class="meta">加载中…</span></div>
</header>
<main>
  <section class="card">
    <div class="head">
      <span class="agent-name">Agent</span>
      <span class="meta">名称实时来自 Raft（显示 displayName，最长 20 秒自动更新）</span>
    </div>
  <section class="card">
    <div class="head">
      <span class="agent-name">本地服务</span>
      <span class="meta">Raft / DSH 启停命令从本机配置读取，仓库不包含任何机器专用 bat</span>
    </div>
    <div id="services" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <div class="head">
      <span class="agent-name">Agent</span>
      <span class="meta">名称实时来自 Raft（改名后 15 秒内自动更新）</span>
    </div>
    <div id="agents" style="margin-top:10px"></div>
  </section>
</main>
<script>
const agentsEl = document.getElementById('agents')
const servicesEl = document.getElementById('services')
const topEl = document.getElementById('topStatus')
let state = null
let actionBusy = false
let serviceBusy = false

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
}

function compactTokens(n) {
  if (n == null || Number.isNaN(n)) return '—'
  if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B'
  if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M'
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K'
  return String(Math.round(n))
}

function phaseText(turnState) {
  if (!turnState) return '未接入'
  switch (turnState.phase) {
    case 'idle': return '空闲'
    case 'starting': return '启动中'
    case 'thinking': return '思考中'
    case 'text': return '输出文本'
    case 'tool': return turnState.lastTool ? `调用工具 · ${turnState.lastTool}` : '调用工具'
    case 'continuing': return '工具返回，继续思考'
    case 'error': return '出错'
    default: return turnState.phase || '空闲'
  }
}

function phaseActive(turnState) {
  return turnState && turnState.phase !== 'idle' && turnState.phase !== 'error'
}

function modelLabel(value) {
  if (!value) return '—'
  return String(value).replace('deepseek/', '').replace(/^gpt-/, '')
}

function effortLabel(value) {
  if (value === 'default') return '默认（跟随）'
  return value || '—'
}

function thinkingTail(turnState) {
  const tail = (turnState?.lastReasoningTail ?? '').trim()
  if (tail) return tail
  if (phaseActive(turnState)) return '（等待思考内容…）'
  return '（暂无思考内容）'
}

function statsHtml(stats) {
  const ttft = stats?.ttftAvgMs != null ? `${(stats.ttftAvgMs / 1000).toFixed(1)}s` : '—'
  const tps = stats?.tokPerSec != null ? `${Math.round(stats.tokPerSec)} tok/s` : '— tok/s'
  const hit = stats?.cacheHitPct != null ? `${Math.round(stats.cacheHitPct)}%` : '—'
  const input = compactTokens(stats?.inputTokens ?? null)
  const output = compactTokens(stats?.outputTokens ?? null)
  return `首 token 平均 <b>${ttft}</b> · <b>${tps}</b> | 缓存命中 <b>${hit}</b> | 输入 <b>${input} tok</b> · 输出 <b>${output} tok</b>`
}

function agentCard(agent) {
  const ts = agent.bridge?.turnState ?? null
  const active = phaseActive(ts)
  const card = document.createElement('div')
  card.className = `card agent-card ${agent.connected ? 'connected' : ''} ${active ? 'active' : ''}`

  const head = document.createElement('div')
  head.className = 'head'
  const name = document.createElement('span')
  name.className = 'agent-name'
  name.textContent = agent.name || '（未命名 agent）'
  const conn = document.createElement('span')
  conn.className = `badge ${agent.connected ? 'ok' : 'bad'}`
  conn.textContent = agent.connected ? '已接入' : '未接入'
  const phase = document.createElement('span')
  phase.className = `badge phase ${active ? 'live' : ''}`
  phase.textContent = phaseText(ts)
  head.append(name, conn, phase)
  if (agent.connected && agent.bridge?.busy) {
    const busy = document.createElement('span')
    busy.className = 'badge live'
    busy.textContent = '请求处理中'
    head.append(busy)
  }

  const meta = document.createElement('div')
  meta.className = 'agent-meta'
  meta.innerHTML = `当前模型 <b>${esc(modelLabel(agent.currentModel))}</b> · 推理深度 <b>${esc(effortLabel(agent.reasoningEffort))}</b>`

  const think = document.createElement('div')
  think.className = 'thinking'
  const phaseLine = document.createElement('div')
  phaseLine.className = 'phase-line'
  const dot = document.createElement('span')
  dot.className = `pulse ${active ? 'on' : ''}`
  const phaseTitle = document.createElement('span')
  phaseTitle.textContent = phaseText(ts)
  phaseLine.append(dot, phaseTitle)
  const scroll = document.createElement('div')
  scroll.className = 'think-scroll'
  scroll.textContent = thinkingTail(ts)
  think.append(phaseLine, scroll)

  const stats = document.createElement('div')
  stats.className = 'stats'
  stats.innerHTML = statsHtml(agent.stats)

  const actions = document.createElement('div')
  actions.className = 'actions'
  if (agent.connected) {
    const btn = document.createElement('button')
    btn.className = 'danger'
    btn.textContent = '断开 DSH'
    btn.disabled = actionBusy
    btn.onclick = () => agentAction(agent, 'disconnect', btn)
    actions.append(btn)
  } else {
    const btn = document.createElement('button')
    btn.textContent = state.raft.running ? '接入 DSH（请先退出 Raft）' : '接入 DSH'
    btn.disabled = actionBusy || state.raft.running
    btn.onclick = () => agentAction(agent, 'connect', btn)
    actions.append(btn)
  }
  if (!agent.connected) {
    const note = document.createElement('span')
    note.className = 'action-note'
    note.textContent = state.raft.running ? '接入时请先退出 Raft，完成后重新打开 Raft' : 'Raft 已退出，可以接入'
    actions.append(note)
  }

  card.append(head, meta, think, stats, actions)
  return card
}

function serviceRow(label, running, configured, serviceName) {
  const row = document.createElement('div')
  row.className = 'row service-row'
  row.style.justifyContent = 'flex-start'

  const name = document.createElement('span')
  name.style.minWidth = '80px'
  name.style.fontWeight = '600'
  name.textContent = label

  const badge = document.createElement('span')
  badge.className = `badge ${running ? 'ok' : 'bad'}`
  badge.textContent = running ? '运行中' : '未运行'
  row.append(name, badge)

  const startBtn = document.createElement('button')
  startBtn.textContent = '启动'
  startBtn.disabled = serviceBusy || running || !configured.startConfigured
  startBtn.onclick = () => serviceAction(serviceName, 'start', startBtn)
  row.append(startBtn)

  const stopBtn = document.createElement('button')
  stopBtn.className = 'danger'
  stopBtn.textContent = '停止'
  stopBtn.disabled = serviceBusy || !running || !configured.stopConfigured
  stopBtn.onclick = () => serviceAction(serviceName, 'stop', stopBtn)
  row.append(stopBtn)

  if (!configured.startConfigured || !configured.stopConfigured) {
    const note = document.createElement('span')
    note.className = 'action-note'
    note.textContent = '未配置启停命令（在 ~/.raft-dsh-console/service-commands.json 配置）'
    row.append(note)
  }
  return row
}

function renderServices() {
  if (!servicesEl) return
  servicesEl.innerHTML = ''
  const svc = state.services ?? {}
  servicesEl.append(serviceRow('DSH', Boolean(svc.dsh?.ok), svc.dsh ?? {}, 'dsh'))
  servicesEl.append(serviceRow('Raft', Boolean(svc.raft?.running), svc.raft ?? {}, 'raft'))
}

async function serviceAction(service, action, btn) {
  const original = btn.textContent
  serviceBusy = true
  btn.disabled = true
  btn.textContent = action === 'start' ? '启动中…' : '停止中…'
  try {
    const res = await fetch(`/api/system/${service}/${action}`, { method: 'POST' })
    const j = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(j.error || res.status)
    btn.textContent = action === 'start' ? '已发出启动命令' : '已完成'
    serviceBusy = false
    setTimeout(load, 1500)
  } catch (e) {
    btn.textContent = `失败：${e.message}`
    serviceBusy = false
    setTimeout(() => { btn.textContent = original }, 3000)
  }
}

function render() {
  topEl.innerHTML = ''
  const dshBadge = document.createElement('span')
  dshBadge.className = `badge ${state.dsh.ok ? 'ok' : 'bad'}`
  dshBadge.textContent = `DSH ${state.dsh.status ?? ''}`.trim()
  const raftBadge = document.createElement('span')
  raftBadge.className = `badge ${state.raft.running ? 'ok' : 'bad'}`
  raftBadge.textContent = `Raft ${state.raft.running ? '运行中' : '未运行'}`
  const refresh = document.createElement('button')
  refresh.className = 'ghost'
  refresh.textContent = '刷新'
  refresh.onclick = load
  topEl.append(dshBadge, raftBadge, refresh)

  renderServices()

  agentsEl.innerHTML = ''
  if (!Array.isArray(state.agents) || state.agents.length === 0) {
    const empty = document.createElement('div')
    empty.className = 'meta'
    empty.textContent = '没有找到 builtin runtime agent。在 Raft 中启动一次 agent 后，这里会自动出现。'
    agentsEl.append(empty)
    return
  }
  const sorted = [...state.agents].sort((a, b) => Number(b.connected) - Number(a.connected) || String(a.name).localeCompare(String(b.name), 'zh-CN'))
  for (const agent of sorted) agentsEl.append(agentCard(agent))
}

async function agentAction(agent, action, btn) {
  const original = btn.textContent
  actionBusy = true
  btn.disabled = true
  btn.textContent = action === 'connect' ? '接入中…' : '断开中…'
  try {
    const res = await fetch(`/api/agents/${encodeURIComponent(agent.id)}/${action}`, { method: 'POST' })
    const j = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(j.error || res.status)
    btn.textContent = '完成 ✓'
    setTimeout(load, 700)
  } catch (e) {
    btn.textContent = `失败：${e.message}`
    actionBusy = false
    btn.disabled = false
    setTimeout(() => { if (btn.isConnected) { btn.textContent = original; actionBusy = false } }, 3000)
  }
}

async function load() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    state = await res.json()
    actionBusy = false
    render()
  } catch (e) {
    topEl.innerHTML = `<span class="badge bad">加载失败：${esc(e.message)}</span>`
  }
}

load()
setInterval(load, 2000)
</script>
</body>
</html>
